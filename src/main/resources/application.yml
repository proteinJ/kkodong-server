spring:
  application:
    name: kkodong-server

  # 견종 목록은 94종이라 여기 두면 나머지 설정이 묻힌다. 별도 파일로 뺐지만
  # 바인딩 경로(kkodong.dog.breed.*)는 한 파일에 있을 때와 동일하다.
  config:
    import: classpath:config/breed-groups.yml

  datasource:
    # Supabase Postgres 연결 문자열로 교체 필요 (Supabase 대시보드 > Settings > Database)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkodong}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate} # 스키마는 Flyway가 관리, 평소엔 validate로 엔티티-테이블 일치 여부만 검증
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

r2:
  endpoint: ${R2_ENDPOINT:}
  access-key: ${R2_ACCESS_KEY:}
  secret-key: ${R2_SECRET_KEY:}
  bucket: ${R2_BUCKET:kkodong}
  public-url: ${R2_PUBLIC_URL:}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-env-var}
  access-token-validity-in-milliseconds: ${JWT_AT_VALIDITY:3600000}      # 1시간
  refresh-token-validity-in-milliseconds: ${JWT_RT_VALIDITY:604800000}  # 7일

apple:
  # iOS 앱의 Bundle Identifier. identity_token의 aud claim과 일치해야 검증 통과.
  # 비밀값이 아니라 앱 식별자라 개발 기본값을 둔다 — 비워두면 aud("")가 되어 모든 토큰이 A006으로 떨어진다.
  # 운영에서는 APPLE_BUNDLE_ID로 덮어쓴다.
  bundle-id: ${APPLE_BUNDLE_ID:com.kkodong.app}

# ============================================================
# 도메인 설정 — 값 목록은 전부 여기서 관리한다
#
# 왜 enum이 아니라 설정값인가: 태그·슬롯 세트는 실사용 데이터로 바뀔 수 있는데
# (의미가 겹치는 태그 병합 등), enum이면 바꿀 때마다 재빌드·재배포가 필요하다.
# 설정값이면 파일 수정 + 재시작으로 끝난다.
#   명세: PawWalk-ios/docs/FRIEND_RECOMMENDATION_SPEC.md
#
# ⚠️ 소유권 주의: 태그·슬롯은 '입력 검증'(dog/user)과 '점수 계산'(recommendation)
#    양쪽에서 쓰인다. recommendation 아래 두면 강아지 등록이 추천 설정을 읽게 되어
#    의존 방향이 뒤집힌다. 그래서 소유 도메인 아래 두고, recommendation이 참조한다.
#
# ⚠️ 개수 제한(최대 3개)은 여기 없다 — DTO의 @Size와 DB CHECK 제약이 담당한다.
#    DB 제약을 바꾸려면 어차피 마이그레이션이 필요해 진짜로 동적일 수 없다.
#    동적이어야 하는 것은 '값 목록'이지 '개수'가 아니다.
# ============================================================
kkodong:
  dog:
    personality:
      # 성향 태그 — DB에는 한글 라벨 문자열 배열로 저장된다(예: ["활발함","사교적"]).
      # 키가 곧 저장·전송되는 값이므로 여기 오타는 데이터를 오염시킨다.
      #
      # 두 형태를 두는 이유(문자열 조작 금지 — 명세 5절):
      #   stem      : 나열할 때        → "활발·사교적인 성격이…"의 앞쪽
      #   adnominal : 명사를 꾸밀 때   → "둘 다 활발한 성격이에요"
      tags:
        "[활발함]":     { stem: 활발,     adnominal: 활발한 }
        "[차분함]":     { stem: 차분,     adnominal: 차분한 }
        "[사교적]":     { stem: 사교적,   adnominal: 사교적인 }
        "[낯가림]":     { stem: 낯가림,   adnominal: 낯가리는 }
        "[겁많음]":     { stem: 겁많음,   adnominal: 겁많은 }
        "[장난꾸러기]": { stem: 장난기,   adnominal: 장난기 많은 }
        "[독립적]":     { stem: 독립적,   adnominal: 독립적인 }
        "[애교많음]":   { stem: 애교,     adnominal: 애교많은 }

  user:
    walk-time-slot:
      # 산책 시간대 — users.walk_time_slots(JSONB)에 키 문자열 배열로 저장된다.
      # ⚠️ 성향 태그와 달리 키가 영문이라 오타가 눈에 띄지 않는다("moring").
      #    기동 시 검증을 반드시 넣을 것 — API_SPEC.md 0절의 6개와 일치해야 한다.
      # 값은 이유 문장에 그대로 들어간다: "{값}에 산책하는 것도 같아요"
      slots:
        dawn: 새벽
        morning: 아침
        noon: 낮
        afternoon: 오후
        evening: 저녁
        night: 밤

  # 친구 추천 알고리즘 (FRIEND-1)
  # 전부 설정값인 이유: 이 숫자들의 유일한 검증 수단이 실사용 데이터인데, 값을 바꿀 때마다
  # 재배포해야 하면 사실상 튜닝을 안 하게 된다.
  # ⚠️ 누적 신청 100건 전에는 가중치를 조정하지 않는다 — 소음에 반응한 튜닝은 알고리즘을 더 나쁘게 만든다.
  recommendation:
    max-radius-km: 5              # distance_score 정규화 기준 + 확장 상한 (QUESTIONS.md Q8 잠정값)
    radius-steps-km: [1, 2, 3, 5] # 후보가 limit 미만이면 이 순서로 확장. 반경은 첫 페이지에서 확정해 cursor에 인코딩
    neutral-score: 0.5            # 데이터 미입력 시 중립값. 0이 아니다 — 미입력 유저가 하위에 깔리면 스스로 콜드스타트를 만든다
    age-tolerance-months: 36      # age_score가 0이 되는 나이 차
    weights:                      # 합계 100 (읽기 쉬우라고). 2026-08-27 개정 — time-slot 신설
      distance: 30
      time-slot: 15
      personality: 20
      age: 15
      size: 12
      breed: 8
      gender: 0                   # 초기 미사용 — 어떤 조합이 더 나은지 근거가 없다
      neutered: 0                 # 초기 미사용
    candidate-cap: 300

  # ============================================================
  # 유치원 미디어 업로드 정책 (PN-15, FR-PN15-02)
  #
  # ⚠️ 전부 잠정치다 — UD-C(보관 기간·해상도·건당 용량 상한)가 아직 미결이다.
  #    PC-23: 유치원 1곳이 하루 100장을 올리면 스토리지가 빠르게 부푼다. 이것이
  #    CONCEPT.md 4절 "고정비 0" 원칙과 충돌하는 유일한 기능이라, 실사용 데이터를
  #    보고 조정해야 한다. 실제 증가 속도는 merchant_media의 size_bytes/width/height로 잰다.
  #
  # ⚠️ 서버는 리사이즈하지 않고 상한을 넘으면 거부한다. 이 코드베이스는 이미
  #    누끼 생성을 온디바이스로 처리해 "서버 이미지 처리 비용 0"을 원칙으로 세웠다
  #    (FR-OB04-01). 리사이즈도 같은 이유로 클라이언트 몫이다.
  # ============================================================
  media:
    max-image-bytes: 10485760     # 10MB — spring.servlet.multipart.max-file-size와 맞춰둔 값
    max-video-bytes: 10485760     # 10MB. ⚠️ 영상을 실제로 받으려면 multipart 상한도 함께 올려야 한다
    max-image-pixels: 24000000    # 2400만 화소(대략 6000x4000). 최신 폰 원본을 받되 그 이상은 거부
    max-per-upload: 20            # 한 번에 올릴 수 있는 파일 수
    image-types:
      "[image/jpeg]": jpg
      "[image/png]":  png
      "[image/webp]": webp
    video-types:
      "[video/mp4]":       mp4
      "[video/quicktime]": mov

  # ============================================================
  # 국세청 사업자등록번호 진위확인 (PN-02, FR-PN02-01)
  #
  # 공공데이터포털(data.go.kr) "국세청_사업자등록정보 진위확인 및 상태조회" — 무료.
  # 번호·대표자명·개업일 세 값을 함께 대조한다. 번호만 맞으면 남의 사업자번호로
  # 매장을 열 수 있기 때문이다.
  #
  # ⚠️ 꺼져 있으면 매장이 검증되지 않은 PENDING으로 남는다 — 통과시킨 척하지 않는다.
  #    견주 앱(KG-01)은 ACTIVE만 노출하므로 미검증 매장이 새어 나가지 않는다.
  # ⚠️ 운영에서는 반드시 enabled: true 로 둘 것.
  # ============================================================
  business-verification:
    enabled: ${NTS_VERIFICATION_ENABLED:false}
    service-key: ${NTS_SERVICE_KEY:}
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
    timeout-millis: 5000        # 국세청 API가 느릴 때 가입 요청이 통째로 묶이지 않게

server:
  port: ${SERVER_PORT:8080}
