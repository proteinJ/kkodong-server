spring:
  application:
    name: kkodong-server

  # 도메인 설정(kkodong.*)은 config/ 아래로 분리했다 — 값 목록이 길어 여기 두면
  # 인프라 설정이 묻힌다. 바인딩 경로는 각 파일에 적힌 그대로이므로
  # @ConfigurationProperties 입장에서는 한 파일에 있는 것과 같다.
  #
  # ⚠️ 태그·슬롯은 소유 도메인(dog/user) 아래 두고 recommendation이 참조한다.
  #    추천 아래 두면 강아지 등록이 추천 설정을 읽게 되어 의존 방향이 뒤집힌다.
  config:
    import:
      - classpath:config/breed-groups.yml      # kkodong.dog.breed.*
      - classpath:config/personality-tags.yml  # kkodong.dog.personality.*
      - classpath:config/walk-time-slots.yml   # kkodong.user.walk-time-slot.*
      - classpath:config/recommendation.yml    # kkodong.recommendation.*

  datasource:
    # Supabase Postgres 연결 문자열로 교체 필요 (Supabase 대시보드 > Settings > Database)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkodong}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate} # 스키마는 Flyway가 관리, 평소엔 validate로 엔티티-테이블 일치 여부만 검증
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

r2:
  endpoint: ${R2_ENDPOINT:}
  access-key: ${R2_ACCESS_KEY:}
  secret-key: ${R2_SECRET_KEY:}
  bucket: ${R2_BUCKET:kkodong}
  public-url: ${R2_PUBLIC_URL:}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-env-var}
  access-token-validity-in-milliseconds: ${JWT_AT_VALIDITY:3600000}      # 1시간
  refresh-token-validity-in-milliseconds: ${JWT_RT_VALIDITY:604800000}  # 7일

apple:
  # iOS 앱의 Bundle Identifier. identity_token의 aud claim과 일치해야 검증 통과.
  # 비밀값이 아니라 앱 식별자라 개발 기본값을 둔다 — 비워두면 aud("")가 되어 모든 토큰이 A006으로 떨어진다.
  # 운영에서는 APPLE_BUNDLE_ID로 덮어쓴다.
  bundle-id: ${APPLE_BUNDLE_ID:com.kkodong.app}

kkodong:
  # ============================================================
  # 견주 지도 — 강아지 동반 매장 탐색 (MAP-01/02, API_SPEC 14절)
  #
  # 계약에 없던 값이라 서버가 정했다(#50). 실제 매장 밀도를 보고 바꿀 수 있게 설정값으로 둔다.
  # ⚠️ 반경 상한이나 페이지 크기를 바꾸면 API_SPEC 14.2 문구도 같이 고칠 것 — iOS 가 그 문서를 보고 만든다.
  # ============================================================
  place:
    default-radius-km: 3   # radiusKm 을 안 보냈을 때
    max-radius-km: 10      # 넘으면 에러가 아니라 이 값으로 자른다. 상한이 없으면 한 번에 전국 매장을 긁어갈 수 있다
    page-size: 50          # 한 번에 내려주는 최대 매장 수. 더 있으면 nextCursor 가 채워진다

  # ============================================================
  # 유치원 미디어 업로드 정책 (PN-15, FR-PN15-02)
  #
  # ⚠️ 전부 잠정치다 — UD-C(보관 기간·해상도·건당 용량 상한)가 아직 미결이다.
  #    PC-23: 유치원 1곳이 하루 100장을 올리면 스토리지가 빠르게 부푼다. 이것이
  #    CONCEPT.md 4절 "고정비 0" 원칙과 충돌하는 유일한 기능이라, 실사용 데이터를
  #    보고 조정해야 한다. 실제 증가 속도는 merchant_media의 size_bytes/width/height로 잰다.
  #
  # ⚠️ 서버는 리사이즈하지 않고 상한을 넘으면 거부한다. 이 코드베이스는 이미
  #    누끼 생성을 온디바이스로 처리해 "서버 이미지 처리 비용 0"을 원칙으로 세웠다
  #    (FR-OB04-01). 리사이즈도 같은 이유로 클라이언트 몫이다.
  # ============================================================
  media:
    max-image-bytes: 10485760     # 10MB — spring.servlet.multipart.max-file-size와 맞춰둔 값
    max-video-bytes: 10485760     # 10MB. ⚠️ 영상을 실제로 받으려면 multipart 상한도 함께 올려야 한다
    max-image-pixels: 24000000    # 2400만 화소(대략 6000x4000). 최신 폰 원본을 받되 그 이상은 거부
    max-per-upload: 20            # 한 번에 올릴 수 있는 파일 수
    image-types:
      "[image/jpeg]": jpg
      "[image/png]":  png
      "[image/webp]": webp
    video-types:
      "[video/mp4]":       mp4
      "[video/quicktime]": mov

  # ============================================================
  # 국세청 사업자등록번호 진위확인 (PN-02, FR-PN02-01)
  #
  # 공공데이터포털(data.go.kr) "국세청_사업자등록정보 진위확인 및 상태조회" — 무료.
  # 번호·대표자명·개업일 세 값을 함께 대조한다. 번호만 맞으면 남의 사업자번호로
  # 매장을 열 수 있기 때문이다.
  #
  # ⚠️ 꺼져 있으면 매장이 검증되지 않은 PENDING으로 남는다 — 통과시킨 척하지 않는다.
  #    견주 앱(KG-01)은 ACTIVE만 노출하므로 미검증 매장이 새어 나가지 않는다.
  # ⚠️ 운영에서는 반드시 enabled: true 로 둘 것.
  # ============================================================
  business-verification:
    enabled: ${NTS_VERIFICATION_ENABLED:false}
    service-key: ${NTS_SERVICE_KEY:}
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
    timeout-millis: 5000        # 국세청 API가 느릴 때 가입 요청이 통째로 묶이지 않게

server:
  port: ${SERVER_PORT:8080}
