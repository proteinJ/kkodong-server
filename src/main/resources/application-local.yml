# src/main/resources/application-local.yml
#
# 로컬 개발용 프로파일. 환경변수(.env) 없이 이 파일만으로 기동된다.
#
# 실행 방법
#   1) 인프라 먼저:  docker compose up -d postgres redis
#   2) IntelliJ:    실행 구성 > '활성화된 프로파일'에 local  (EnvFile 체크 불필요)
#      터미널:       ./gradlew bootRun --args='--spring.profiles.active=local'
#   3) Swagger UI:  http://localhost:8090/swagger-ui/index.html
#
# ⚠️ 이 파일은 git에 커밋된다. 실제 비밀값을 넣지 말 것 —
#    운영값은 application.yml의 ${ENV_VAR:기본값} 자리에 환경변수로 주입한다.
#    (Supabase 등 원격 DB로 붙일 때는 이 프로파일을 쓰지 않는다)

spring:
  # 로컬 Redis는 6380 — 6379는 다른 프로젝트 컨테이너가 점유 중이고
  # 그쪽은 비밀번호가 걸려 있어 로그인(Refresh Token 저장)이 500으로 실패한다.
  # docker-compose.yml이 6380:6379로 매핑한다.
  data:
    redis:
      host: localhost
      port: 6380

  # 로컬 Postgres는 5433 — 5432도 다른 프로젝트가 점유 중이다.
  # postgis 이미지여야 한다(V1__init.sql 첫 줄이 CREATE EXTENSION postgis).
  datasource:
    url: jdbc:postgresql://localhost:5433/kkodong
    username: postgres
    password: postgres

  jpa:
    hibernate:
      # ⚠️ 로컬에서도 validate를 유지한다. 스키마는 Flyway가 관리하며,
      #    update로 바꾸면 Hibernate가 마이그레이션과 다른 스키마를 만들어
      #    "로컬에선 되는데 배포하면 깨지는" 상태가 된다.
      #    스키마를 바꾸려면 V{다음번호}__*.sql 마이그레이션을 추가할 것.
      ddl-auto: validate

server:
  port: 8090

# ⚠️ 로컬 전용 더미. 실제 업로드는 동작하지 않는다 —
#    이미지 업로드를 테스트하려면 환경변수로 실제 R2 값을 주입할 것.
r2:
  endpoint: https://dummy.r2.cloudflarestorage.com
  access-key: dummy
  secret-key: dummy
  bucket: kkodong
  public-url: ""

# 로컬 전용 서명 키. 명시해 두는 이유는 base의 'change-this-...' 자리표시자에
# 조용히 기대지 않기 위해서다 — 그 값이 쓰이고 있다는 걸 아무도 모르게 된다.
# HS256이므로 최소 256비트(32바이트) 이상이어야 한다.
jwt:
  secret: local-dev-only-kkodong-jwt-signing-key-do-not-use-in-production-0123456789

# 비워두면 Sign in with Apple 검증만 실패하고 나머지는 정상 기동한다.
# 실제 검증을 테스트하려면 Xcode 프로젝트의 Bundle Identifier를 넣을 것.
apple:
  bundle-id: ""

logging:
  level:
    # 실행되는 SQL과 바인딩되는 실제 파라미터까지 본다.
    # show-sql만으로는 물음표(?)만 보여서 어떤 값이 들어갔는지 알 수 없다.
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    # 어떤 마이그레이션이 적용/검증됐는지.
    org.flywaydb: INFO
    com.kkodong.server: DEBUG
