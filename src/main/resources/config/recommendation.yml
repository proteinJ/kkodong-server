# 친구 추천 알고리즘 (FRIEND-1) — 명세: docs/design/RECOMMENDATION.md
#
# 왜 별도 파일인가: 튜닝 대상이 한곳에 모여 있어야 "무엇을 만졌는지"가 커밋에 드러난다.
#   바인딩 경로는 여기 적힌 그대로 kkodong.recommendation.* 다.
#
# 전부 설정값인 이유: 이 숫자들의 유일한 검증 수단이 실사용 데이터인데, 값을 바꿀 때마다
#   재배포해야 하면 사실상 튜닝을 안 하게 된다.
#
# ⚠️ 누적 신청 100건 전에는 가중치를 조정하지 않는다 — 소음에 반응한 튜닝은 알고리즘을 더 나쁘게 만든다.
#
# ⚠️ 성향 태그·산책 시간대는 여기 없다. 소유 도메인(dog/user) 아래에 있고 추천이 참조한다 —
#    추천 아래 두면 강아지 등록이 추천 설정을 읽게 되어 의존 방향이 뒤집힌다.
kkodong:
  recommendation:
    max-radius-km: 5              # distance_score 정규화 기준 + 확장 상한 (QUESTIONS.md Q8 잠정값)
    radius-steps-km: [1, 2, 3, 5] # 후보가 limit 미만이면 이 순서로 확장. 반경은 첫 페이지에서 확정해 cursor에 인코딩
    neutral-score: 0.5            # 데이터 미입력 시 중립값. 0이 아니다 — 미입력 유저가 하위에 깔리면 스스로 콜드스타트를 만든다
    age-tolerance-months: 36      # age_score가 0이 되는 나이 차
    candidate-cap: 300            # 점수를 매길 후보 풀 상한. 응답 개수(limit)와 무관하고, 페이징의 최대 깊이이기도 하다

    weights:                      # 합계 100 (읽기 쉬우라고). 2026-08-27 개정 — time-slot 신설
      distance: 30
      time-slot: 15
      personality: 20
      age: 15
      size: 12
      breed: 8
      gender: 0                   # 초기 미사용 — 어떤 조합이 더 나은지 근거가 없다
      neutered: 0                 # 초기 미사용

    # 이유 문장(reason)의 임계치 — 명세 5절의 절(clause) 조건표.
    #
    # 문구 자체("나이가 비슷해요")는 코드에 둔다. 바꾸려면 어차피 배포가 필요하고,
    # 설정으로 빼면 조립 로직과 문자열이 갈라져 오히려 읽기 어려워진다.
    # 반면 "18개월을 비슷하다고 볼 것인가"는 실사용 데이터로 바뀔 판단이라 여기 둔다.
    #
    # 나머지 조건(겹치는 슬롯 있음 / 같은 견종·그룹 / 같은 체급)은 임계치가 아니라
    # 구조적 조건이라 설정이 없다 — 각각 빈 리스트 여부, enum 값, 단계 차 0 이다.
    reason:
      personality-many-tags: 2    # 이 개수 이상 겹치면 나열형 문구("활발·사교적인 성격이…")
      age-very-close-months: 6    # 이하면 "나이가 거의 같아요"
      age-close-months: 18        # 이하면 "나이가 비슷해요"
      walk-distance-km: 1         # 이하면 거리 fallback이 "걸어서 만날 수 있는 거리예요"
      max-clauses: 2              # 문장에 넣을 절 개수 상한. 3개를 넘기면 카드에서 읽히지 않는다
