# 견종 목록 & 그룹 — breed_score(추천 가중치 8점)의 입력이자, 견종 선택지의 원본.
#
# 왜 별도 파일인가: 목록이 길어 application.yml에 두면 나머지 설정이 묻힌다.
#   application.yml의 spring.config.import 로 읽으므로 바인딩 경로는 여기 적힌 그대로
#   kkodong.dog.breed.groups 다 — @ConfigurationProperties 입장에서는 한 파일에 있는 것과 같다.
#
# ⚠️ 이 목록이 곧 클라이언트 선택지다. 자유 입력을 받지 않고 여기 있는 값만 허용한다
#    (성향 태그·산책 시간대와 같은 방식). 그래서 표기 변형(몰티즈/말티즈, 시추/시츄)을
#    넣지 않는다 — 애초에 고를 수 없으면 들어올 수 없다.
#
# ⚠️ 크기 변형은 합친다. 토이/미니어처/스탠다드 푸들을 나누지 않는 이유는 체급이
#    이미 별도 신호(size, 12점)로 잡히기 때문이다. 견종에서 또 나누면 같은 정보를
#    두 번 세게 된다.
#
# ⚠️ 이 표의 목표는 견종학적 정확성이 아니라 "견주가 보기에 비슷한 종류"다
#    (docs/design/RECOMMENDATION.md 2절). FCI 10그룹을 쓰지 않는 이유다 —
#    포메라니안은 계통상 스피츠지만 국내에서는 소형 반려견으로 인식되므로
#    small_companion 에 둔다. 요크셔테리어·실키테리어도 이름은 테리어지만 같은 이유다.
#
# ⚠️ 한 견종은 정확히 한 그룹에만 넣는다. 중복되면 조회 맵을 만들 때 기동이 실패한다.
#
# ⚠️ 그룹의 나열 순서가 곧 선택 화면의 섹션 순서다. small_companion 이 국내 등록의
#    대다수라 맨 앞에 둔다. Spring 이 Map 을 LinkedHashMap 으로 바인딩해 이 순서가
#    유지되지만 문서화된 계약은 아니므로, PropertiesBindingTest 가 containsExactly 로
#    순서까지 고정한다.
#
# display 는 클라이언트 선택 화면의 섹션 제목이다. 서버가 내려줘야 하는 이유는
# 앱에 박아두면 그룹 이름 하나 고치는 데 앱 심사를 다시 받아야 하기 때문이다.
#
# 목록에 없는 견종을 위해 '기타'를 둔다. 기타는 other 취급이고,
# other 끼리는 같은 그룹으로 치지 않으므로(0.2) 잘못된 가산점이 생기지 않는다.

kkodong:
  dog:
    breed:
      groups:

        # 소형 반려견 — 국내 등록의 절대다수. 말티즈·푸들 둘이 전체의 약 40%다.
        small_companion:
          display: 소형 반려견
          breeds:
            - 말티즈
            - 푸들
            - 말티푸
            - 포메라니안
            - 치와와
            - 시츄
            - 요크셔테리어
            - 실키테리어
            - 비숑프리제
            - 페키니즈
            - 파피용
            - 미니어처핀셔
            - 퍼그
            - 프렌치불독
            - 보스턴테리어
            - 라사압소
            - 하바니즈
            - 재패니즈친
            - 카발리에킹찰스스파니엘
            - 브뤼셀그리펀
            - 차이니즈크레스티드
            - 코통드툴레아
            - 볼로네즈
            - 이탈리안그레이하운드

        # 테리어 — 기질이 뚜렷해 하나로 묶는 편이 견주 체감과 맞는다.
        # (요크셔·실키·보스턴테리어는 위 small_companion 에 있다)
        terrier:
          display: 테리어
          breeds:
            - 잭러셀테리어
            - 슈나우저
            - 웨스트하이랜드화이트테리어
            - 폭스테리어
            - 케언테리어
            - 스코티시테리어
            - 베들링턴테리어
            - 노퍽테리어
            - 노리치테리어
            - 에어데일테리어
            - 불테리어
            - 스태퍼드셔불테리어

        # 사냥·스포팅 — 리트리버, 스패니얼, 하운드, 포인터, 닥스훈트
        sporting:
          display: 사냥·스포팅
          breeds:
            - 비글
            - 골든리트리버
            - 래브라도리트리버
            - 노바스코샤덕톨링리트리버
            - 코커스패니얼
            - 잉글리시스프링어스패니얼
            - 브리타니스패니얼
            - 닥스훈트
            - 바셋하운드
            - 블러드하운드
            - 잉글리시포인터
            - 저먼숏헤어드포인터
            - 와이마라너
            - 비즐라
            - 아이리시세터
            - 잉글리시세터
            - 고든세터
            - 휘핏
            - 그레이하운드
            - 보르조이
            - 아프간하운드
            - 살루키
            - 로디지안리지백

        # 목축·사역 — 활동량이 많고 체급이 큰 편
        herding:
          display: 목축·사역
          breeds:
            - 웰시코기
            - 보더콜리
            - 저먼셰퍼드
            - 벨지안말리노이즈
            - 오스트레일리안셰퍼드
            - 셔틀랜드시프독
            - 올드잉글리시시프독
            - 오스트레일리안캐틀독
            - 사모예드
            - 시베리안허스키
            - 알래스칸말라뮤트
            - 버니즈마운틴독
            - 그레이트피레니즈
            - 세인트버나드
            - 뉴펀들랜드
            - 로트와일러
            - 도베르만
            - 복서
            - 그레이트데인
            - 마스티프
            - 불마스티프
            - 잉글리시불독
            - 아메리칸불리
            - 차우차우
            - 아키타
            - 시바
            - 스피츠
            - 달마시안

        # 한국 견종
        korean:
          display: 한국 견종
          breeds:
            - 진돗개
            - 삽살개
            - 풍산개
            - 동경이
            - 제주개

        # ⚠️ 믹스는 '같은 그룹'으로 묶지 않는다. 믹스끼리 유사하다는 근거가 없고,
        #    국내 선호 견종 3위라 비중이 커서 잘못 묶으면 매칭 품질이 크게 흔들린다.
        #    breed_score 계산에서 이 그룹은 항상 0.3으로 특수 처리한다.
        mixed:
          display: 믹스
          breeds:
            - 믹스

        # 목록에 없는 견종. 저장은 되지만 그룹 매칭에서는 other 취급(0.2)이다.
        etc:
          display: 기타
          breeds:
            - 기타
