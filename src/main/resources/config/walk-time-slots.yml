# 산책 시간대 — time_slot_score(추천 가중치 15점)의 입력이자, 온보딩 선택지의 원본.
#
# 왜 별도 파일인가: personality-tags.yml 과 같은 이유다. 바인딩 경로는 여기 적힌 그대로
#   kkodong.user.walk-time-slot.slots 다.
#
# 왜 시간대가 신호인가: 거리 논리를 시간축에 적용한 것이다. 같은 동네여도 나는 새벽 6시,
#   상대는 밤 11시면 평생 안 마주친다. 개친구가 실제로 생기는 메커니즘은 "성격이 맞아서"가
#   아니라 "매일 저녁 8시에 같은 데서 마주쳐서"다.
#
# ⚠️ 성향 태그와 반대다 — 여기서는 **키가 API·DB 계약**이고 값은 표시용이다.
#    자유롭게 바꿀 수 있는 것은 표시 이름뿐이고, 키가 아래 6개와 다르면 서버가 기동을 거부한다.
#    영문 키라 "moring" 같은 오타가 눈에 띄지 않기 때문이다(docs/API_SPEC.md 0절과 일치해야 한다).
#
# ⚠️ 소유권: 슬롯은 '입력 검증'(user)과 '점수 계산'(recommendation) 양쪽에서 쓰인다.
#    소유 도메인(user) 아래 두고 recommendation이 참조한다.
kkodong:
  user:
    walk-time-slot:
      # users.walk_time_slots(JSONB)에 키 문자열 배열로 저장된다.
      # 값은 이유 문장에 그대로 들어간다: "{값}에 산책하는 것도 같아요"
      slots:
        dawn: 새벽         # 05~08
        morning: 아침      # 08~11, 출근 전 산책
        noon: 낮           # 11~15, 여름철엔 노면 온도로 기피
        afternoon: 오후    # 15~18
        evening: 저녁      # 18~21, 최대 피크
        night: 밤          # 21~24
