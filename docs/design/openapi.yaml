          description: OK — 미구독이면 data는 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf: [{ $ref: "#/components/schemas/Subscription" }]
                        nullable: true
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ============================================================
  # Safety (SAFETY-1/2)
  # ============================================================
  /blocks:
    get:
      tags: [Safety]
      summary: 차단 목록
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Block" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Safety]
      summary: 유저 차단 (SAFETY-1)
      description: >
        차단 시 서버가 전부 Service 계층에서 처리한다(RLS 없음):
        추천 목록 양방향 제외, 친구 신청 403, 기존 friendship의 채팅·약속 비활성화,
        채팅 SUBSCRIBE/SEND 거부, 커뮤니티 글/댓글 목록에서 제외.


        ⚠️ 이 중 실제로 구현된 것은 **차단 레코드 적재뿐**이다 — 추천/신청/채팅/
        커뮤니티가 아직 없기 때문이다. 각 도메인 착수 시 차단 검증을 함께 넣는다.


        **차단은 멱등이라 201이 아니라 200이다.** 이미 차단한 상대를 다시 차단해도
        기존 차단을 그대로 반환한다 — 클라이언트에게 중요한 건 "새로 만들어졌는가"가
        아니라 "차단된 상태인가"이고, 재시도가 409로 실패하면 UI가 불필요하게 에러를
        띄워야 한다.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockCreate" }
      responses:
        "200":
          description: OK — 신규 차단이든 기존 차단이든 동일하게 200
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BlockResult" }
        "400":
          description: 자기 자신 차단(B001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 존재하지 않는 유저(M004)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /blocks/{blockedId}:
    parameters:
      - name: blockedId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Safety]
      summary: 차단 해제
      description: >
        **해제도 멱등이다** — 차단하지 않은 상대를 해제해도 200이고 404가 아니다.
        해제 버튼은 차단 목록 화면에서만 눌리는데, 목록이 낡아 없는 대상이 눌렸더라도
        사용자가 원한 최종 상태("차단돼 있지 않음")는 이미 달성돼 있기 때문이다.
      responses:
        "200": { $ref: "#/components/responses/OkNoData" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /reports:
    post:
      tags: [Safety]
      summary: 신고 (유저 / 커뮤니티 글 / 댓글)
      description: >
        Apple 심사 가이드라인 1.2 대응. Phase 1은 별도 관리자 UI 없이 reports 테이블
        적재만 하고, 개발자가 Supabase 대시보드에서 직접 상태를 변경한다.
        **신고가 자동 차단으로 이어지지는 않는다**(오남용 방지) — 별개 액션.
        클라이언트가 "차단도 함께" 체크박스를 제공한다면 `POST /reports` 와
        `POST /blocks` 를 각각 호출해야 한다.


        차단(멱등, 200)과 달리 신고는 접수될 때마다 새 기록이 남아야 하므로 201이다.


        ⚠️ **Phase 1 은 `targetType: user` 만 받는다.** community_post /
        community_comment 는 참조할 테이블이 아직 없어(COMMUNITY-1 미착수) 400
        `R006` 으로 거부된다. reports.target_id 는 다형 참조라 FK 를 걸 수 없어
        (V4 마이그레이션 주석) 대상 존재 검증은 Service 가 유일한 방어선이고,
        지금 통과시키면 존재하지 않는 UUID 가 그대로 적재된다.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ReportResult" }
        "400":
          description: >
            자기 자신 신고(R001) / 유효하지 않은 사유(R004) / 유효하지 않은 대상
            유형(R005) / 아직 지원하지 않는 대상 유형(R006) / 입력값 검증 실패(CM001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 신고 대상을 찾을 수 없음(R002)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: >
            이미 접수되어 처리 대기 중인 신고(R003). 처리 완료 후 재신고는 허용된다
            (부분 유니크 인덱스 `uq_reports_pending`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ============================================================
  # Meet — 만남 진입로 (MEET-2, v3.1 신설)
  # API_SPEC.md 12절. 서버 미구현 — WALK-1/CARD-1 이후 착수.
  # ============================================================
  /walk-sessions/{walkSessionId}/encounters:
    parameters:
      - name: walkSessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Meet]
      summary: 스침 후보 조회 (MEET-2)
      description: >
        이 산책에서 시간·구간이 겹친 강아지 후보. 산책 종료 직후 완료 카드와 함께
        노출된다.


        **후보 판정**: 동일 타일(25m) 또는 인접 타일에 시간 창 ±5분 이내로 양쪽
        궤적이 존재하면 '스침' 후보다. GPS 오차(도심 10~50m)를 감안해 **시간은 좁게,
        거리는 넓게** 잡는다. 임계치는 application.yml 설정값으로 분리한다 —
        느슨하면 "본 적 없는 개"가 뜨고 빡빡하면 아무도 안 뜬다.


        **제외 대상**: 본인 소유 강아지, 차단 관계(양방향), 이미 친구인 상대.
        후보가 없으면 빈 배열이며, 클라이언트는 질문 자체를 노출하지 않는다.


        ⚠️ WALK-1 이 경로에 **타일 + 타임스탬프**를 기록하지 않으면 이 기능은
        소급이 불가능하다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/EncounterCandidates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /walk-sessions/{walkSessionId}/encounters/confirm:
    parameters:
      - name: walkSessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Meet]
      summary: ★ 만난 강아지 확인 — 상호 확인 시에만 친구 연결 (MEET-2)
      description: >
        **상호 확인 규칙이 이 절의 핵심이다.**


        · 양쪽이 서로를 선택 → friendships INSERT + 채팅 개설 (@Transactional)

        · 한쪽만 선택 → 아무 일도 일어나지 않고, **상대에게 알리지 않는다**


        확인은 산책 종료 후 **24시간 이내**만 허용한다(그 이후엔 기억이 흐려져
        오확인이 는다) — 초과 시 400.


        상호 확인으로 생긴 friendships 는 `source_request_id`가 NULL 이다 —
        FRIEND-2 경유분과 수락률을 분리 측정하기 위해서다(V5 마이그레이션 주석).


        **지표**: 후보 노출 수 / 선택 수 / 상호 일치율. 상호 일치율이 친구 신청
        수락률(FRIEND-2)보다 유의하게 높은지가 이 설계의 성패 판정 기준이다.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncounterConfirmRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/EncounterConfirmResult" }
        "400":
          description: 산책 종료 후 24시간 초과 등 확인 불가 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
