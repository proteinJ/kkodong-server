openapi: 3.0.3
info:
  title: 꼬동(KKODONG) API — Phase 1 / Spring Boot
  version: "3.0.0"
  description: >
    꼬동 Phase 1 API 명세. 사람이 읽는 상세 설명/설계 근거는 docs/api/API_SPEC.md,
    제품 기획은 docs/KKODONG_CONCEPT.md 참조. 코드네임/리포지토리는 PawWalk 유지.


    **v3(2026-08-15) 변경**: 핵심 기능이 "산책 모집글 매칭"에서 "강아지 친구 추천"으로
    바뀌면서 /walk-posts·/walk-post-requests·/connections 계열이 전부 폐기되고
    /friends/recommendations·/friend-requests·/friendships로 대체됐다. 산책 약속,
    배변 기록, 저장 경로, 커뮤니티, 누끼 업로드가 신설됐고 /dogs/{id}/vaccinations는
    /dogs/{id}/care-records로 확장됐다. 실시간 위치 공유(STOMP /topic/location.*)는
    v3 Phase 1 범위에서 제외됐다.


    백엔드는 Java Spring Boot 자체 서버. Supabase는 Postgres DB 호스팅 용도로만
    쓰이고 PostgREST/RLS/Realtime/Auth는 사용하지 않는다.


    **모든 응답은 공통 envelope로 감싸진다** (`global/common/ApiResponse`):
    `{success, message, data, code}`. `data`는 실제 payload(본 문서의 각 스키마),
    실패 시 `data`는 `null`이고 `code`는 `global/error/ErrorCode`의 코드값(예: `M001`),
    성공 시 `code`는 `"SUCCESS"` 고정. 아래 각 응답 스키마는 이 envelope로 감싸인
    형태로 표기한다(`ApiResponse` + `allOf`). **204를 쓰는 엔드포인트는 없다** —
    삭제·로그아웃도 200 + `data: null`이다.


    **JSON 필드는 camelCase다**(2026-08-19 결정 — Jackson 기본값, 별도 설정 없음).
    DB 컬럼/테이블명은 snake_case를 유지하므로, 설명 안에서 `users.home_location`
    처럼 표기된 것은 DB 컬럼이지 JSON 필드가 아니다. 신고 사유·대상 유형 같은
    **enum 값 문자열**(`inappropriate_behavior`, `community_post` 등)도 snake_case다.


    **구현 상태**: 2026-08-27 기준 Auth / Profile / Dogs / Safety 만 구현돼 있다.
    나머지 태그(Friends, Chat & Appointments, Walk, Community, Pet Care,
    Service Area, Subscription, Push Tokens)는 **아직 서버에 코드가 없는 목표
    계약**이다. 구현된 절은 실제 코드(`kkodong-server`)에 맞춰 기술돼 있고,
    미구현 절은 착수 시점에 코드와 대조해야 한다.


    실시간 채널(Spring WebSocket + STOMP — 채팅 API_SPEC.md 3절)은 WebSocket 기반이라
    OpenAPI(HTTP 전용 스펙)로 표현할 수 없다. 연결 엔드포인트는 `wss://{host}/ws`,
    채팅 SUBSCRIBE `/topic/chat.{friendshipId}` / SEND `/app/chat.{friendshipId}`.


    **위치 좌표 규약**: 클라이언트-서버 계약은 항상 `{lat, lng}` 평범한 숫자다.
    PostGIS 변환(ST_MakePoint(lng, lat) — 경도 먼저)은 서버 Service 계층 책임.
    상대방의 원본 좌표는 절대 응답에 포함하지 않는다(정수 km 거리로만 노출).

servers:
  - url: https://{host}/api/v1
    description: Spring Boot 서버 (도메인 미확정 — QUESTIONS.md Q6)
    variables:
      host:
        default: your-domain.example.com

security:
  - BearerAuth: []

tags:
  - name: Auth
  - name: Profile
  - name: Dogs
  - name: Friends
    description: ★ v3 핵심 — 강아지 친구 추천/신청/목록 (FRIEND-1/2/3)
  - name: Chat & Appointments
  - name: Push Tokens
  - name: Walk
    description: 산책 세션, 배변 기록, 저장 경로 (WALK-1/2/3)
  - name: Walk Cards
  - name: Community
  - name: Pet Care
  - name: Service Area
    description: 🟠 하드 게이팅 유지 여부 미결정 — QUESTIONS.md Q8
  - name: Subscription
  - name: Safety
  - name: Meet
    description: 만남 진입로 — 산책 후 스침 상호 확인 (MEET-2, v3.1 신설)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        로그인/토큰갱신 응답으로 받은 accessToken. 공개 엔드포인트는 생략 가능(각
        operation에 명시). 만료/무효 토큰은 401(A002/A003), Redis 로그아웃
        블랙리스트에 등록된 토큰도 401(A002)로 거부된다 — 이 401 응답은 모든 인증
        필요 엔드포인트에 공통 적용되므로 각 operation마다 반복 문서화하지 않는다.

  responses:
    Unauthorized:
      description: 인증 실패 — 토큰 없음/만료/무효(A002, A003)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: 권한 없음 — 본인 소유가 아니거나 차단 관계, 패스권 한도 초과 등(A005)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: 존재하지 않는 리소스
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BadRequest:
      description: 입력값 검증 실패(CM001) 또는 비즈니스 규칙 위반
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: 중복 — 이미 존재하는 pending 신청, 이미 맺어진 친구 관계 등
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    OkNoData:
      description: >
        OK — 성공. envelope 만 돌아오고 data 는 null 이다.


        ⚠️ **서버는 성공에 204를 쓰지 않는다.** 모든 응답이 `ApiResponse` envelope 로
        감싸이므로 바디가 항상 존재한다(`global/common/ApiResponse`). 삭제·로그아웃
        같은 "돌려줄 것이 없는" 동작도 200 + `{success, message, data: null, code}` 다.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponse"
              - type: object
                properties:
                  data: { type: object, nullable: true, example: null }

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: 커서 기반 페이지네이션. 이전 응답의 nextCursor를 그대로 전달
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  schemas:
    # ---------------- 공통 envelope ----------------
    ApiResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "조회 성공" }
        code:
          type: string
          nullable: true
          example: "SUCCESS"
          description: 성공 시 "SUCCESS" 고정, 실패 시 ErrorCode 값(예 "M001") 또는 null

    ApiError:
      description: 실패 응답(success=false, data=null)
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            success: { type: boolean, example: false }
            data: { type: object, nullable: true, example: null }

    Coordinate:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, example: 37.5219 }
        lng: { type: number, format: double, example: 126.9745 }

    # ---------------- 유저 / 인증 ----------------
    User:
      type: object
      description: >
        본인 프로필. 구현: `domain/user/dto/UserResponse`.


        ⚠️ **응답에 위치가 없다** — home_location 은 본인 조회에도 포함하지 않는다.
        타인의 위치는 어떤 경로로도 좌표 그대로 노출되지 않는다.


        ⚠️ **walkTimeSlots 는 PATCH 로 저장되지만 응답에는 실리지 않는다**(2026-08-27
        현재). 클라이언트가 방금 저장한 값을 되받아 확인할 수 없다 — 온보딩 UI 가
        선택 상태를 복원하려면 응답에 추가해야 한다. 미해결 항목(API_SPEC.md 하단).
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          type: string
          enum: [USER, ADMIN]
          description: >
            보일러플레이트 인증 패턴 이식용 컬럼(DB_SCHEMA.sql 원본에는 없었다).
            클라이언트가 쓸 일은 없지만 실제 응답에 실리므로 계약에 명시한다.
        displayName: { type: string, nullable: true }
        profileImageUrl: { type: string, nullable: true }
        onboardingCompletedAt: { type: string, format: date-time, nullable: true }

    # 아래 필드들은 DB(users)에는 있지만 현재 어떤 응답에도 실리지 않는다.
    # 해당 도메인 착수 시 User 스키마로 옮긴다.
    #   subscriptionTier  — PASS-1 착수 시 (users.subscription_tier)
    #   phoneVerifiedAt   — QUESTIONS.md Q7 결정 후 (users.phone_verified_at)
    #   createdAt         — 쓰는 화면이 없어 미노출

    UserSummary:
      type: object
      description: 타인에게 노출되는 최소 정보
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, nullable: true }
        profileImageUrl: { type: string, nullable: true }

    AuthTokens:
      type: object
      description: >
        구현: `domain/user/domain/TokenDto`.


        ⚠️ **user 객체를 함께 내려주지 않는다.** 로그인 직후 온보딩 분기
        (onboardingCompletedAt)를 판단하려면 클라이언트가 `GET /users/me` 를 한 번 더
        호출해야 한다 — FOUNDATION-2 라우팅 구현 시 왕복 1회가 추가된다.
      properties:
        grantType: { type: string, example: "Bearer" }
        accessToken: { type: string }
        refreshToken: { type: string }
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: access token 만료까지 남은 시간(ms)
          example: 3600000

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AppleSignInRequest:
      type: object
      required: [identityToken]
      properties:
        identityToken:
          type: string
          description: ASAuthorizationController에서 받은 Apple identity token(JWT). 서버가 Apple JWKS로 서명 검증

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: 폐기할 Refresh Token. Access Token은 Authorization 헤더로 전달(블랙리스트 등록용)

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }

    UserUpdate:
      type: object
      description: >
        전부 선택 필드다 — null/미포함이면 "변경하지 않음"으로 처리된다
        (`User.updateProfile`). 빈 배열을 보내 walkTimeSlots 를 비우는 것은 가능하다.
      properties:
        displayName: { type: string }
        profileImageUrl: { type: string }
        walkTimeSlots: { $ref: "#/components/schemas/WalkTimeSlots" }
        homeLocation:
          allOf: [{ $ref: "#/components/schemas/Coordinate" }]
          description: >
            견주의 대략적 위치("집 근처"). 온보딩에서 한 번 설정. 친구 추천의 거리
            신호 기준점이다(KKODONG_CONCEPT.md 2.1). GPS 실시간 추적 아님.


            ⚠️ 객체를 보낼 때 lat/lng 는 **둘 다 필수**이고 각각 ±90/±180 범위를
            벗어나면 400(CM001)이다.

    WalkTimeSlots:
      type: array
      maxItems: 3
      uniqueItems: true
      items:
        type: string
        enum: [dawn, morning, noon, afternoon, evening, night]
      example: ["morning", "evening"]
      description: >
        주로 산책하는 시간대 — 친구 추천의 2순위 신호(가중치 15, 2026-08-27 신설).
        새벽(05~08) / 아침(08~11) / 낮(11~15) / 오후(15~18) / 저녁(18~21) / 밤(21~24).


        6개 중 최대 3개, 빈 배열 허용. 값 유효성은 서버 설정
        (`kkodong.user.walk-time-slot.slots`, 위반 시 400 `M007`), 개수 제한은
        DTO `@Size` + DB CHECK(`chk_users_walk_time_slots`) — 성향 태그와 같은 분담.


        ⚠️ 미입력은 추천 점수에서 0점이 아니라 중립(0.5)이다.
        상세: docs/FRIEND_RECOMMENDATION_SPEC.md 2절.

    # ---------------- 반려견 ----------------
    PersonalityTraits:
      type: array
      maxItems: 3
      uniqueItems: true
      items:
        type: string
        enum: [활발함, 차분함, 사교적, 낯가림, 겁많음, 장난꾸러기, 독립적, 애교많음]
      example: ["활발함", "사교적"]
      description: >
        성향 태그 — 친구 추천의 핵심 신호(가중치 20, FRIEND-1. 2026-08-27 개정 전
        25). 8개 중 최대 3개, 빈 배열 허용. 2026-08-15 확정(QUESTIONS.md Q10),
        상세는 docs/FRIEND_RECOMMENDATION_SPEC.md 1절.


        서버 검증: 개수 제한(≤3)은 DTO `@Size` + DB CHECK 제약, 값 유효성은 서버
        설정값(`kkodong.dog.personality.tags`, 위반 시 400 `D004`). 태그 세트는
        실사용 데이터로 바뀔 수 있으므로 DB/코드에 문자열을 박지 않는다.


        ⚠️ 빈 배열은 추천 점수에서 **0점이 아니라 중립(0.5)**으로 처리된다 —
        태그를 건너뛴 신규 유저가 추천 하위에 영구히 깔리는 것을 막기 위해서다.

    Dog:
      type: object
      description: >
        구현: `domain/dog/dto/DogResponse.detailInfo`. `POST /dogs`, `GET /dogs`,
        `GET /dogs/{dogId}`, `/photo`, `/cutout` 의 응답.


        ⚠️ createdAt/updatedAt 은 DB(dogs)에는 있지만 응답에 싣지 않는다.
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        name: { type: string }
        breed: { type: string, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        gender: { type: string, enum: [male, female], nullable: true }
        size: { type: string, enum: [small, medium, large], nullable: true }
        weightKg: { type: number, nullable: true }
        energyLevel: { type: string, enum: [low, medium, high], nullable: true }
        personalityTraits:
          $ref: "#/components/schemas/PersonalityTraits"
        neutered: { type: boolean, nullable: true }
        profileImageUrl: { type: string, nullable: true }
        cutoutImageUrl:
          type: string
          nullable: true
          description: 누끼(배경제거) 이미지 URL. 프로필/추천피드/산책카드 공통 사용
        animalRegistrationNumber:
          type: string
          nullable: true
          description: 표시용만 — 공공 API 연동 없음(QUESTIONS.md Q1 폐기 확정)

    DogPatchResult:
      type: object
      description: >
        `PATCH /dogs/{dogId}` 전용 응답(`DogResponse.patch`). Dog 와 달리
        **id/ownerId 가 없다** — 클라이언트는 요청에 쓴 dogId 를 그대로 갖고 있다는
        전제다. 나머지 필드는 Dog 와 동일하다.
      properties:
        name: { type: string }
        breed: { type: string, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        gender: { type: string, enum: [male, female], nullable: true }
        size: { type: string, enum: [small, medium, large], nullable: true }
        energyLevel: { type: string, enum: [low, medium, high], nullable: true }
        neutered: { type: boolean, nullable: true }
        profileImageUrl: { type: string, nullable: true }
        cutoutImageUrl: { type: string, nullable: true }
        animalRegistrationNumber: { type: string, nullable: true }
        personalityTraits:
          $ref: "#/components/schemas/PersonalityTraits"
        weightKg: { type: number, nullable: true }

    DogCreate:
      type: object
      required: [name]
      description: >
        ⚠️ gender/size/energyLevel 은 **대소문자를 가리지 않는다** — 서버가
        `valueOf(toUpperCase())` 로 변환하므로 `male` 과 `MALE` 이 모두 통과하고,
        응답은 항상 소문자다. 정의되지 않은 값은 현재 400이 아니라 500으로 나간다
        (`IllegalArgumentException` 미핸들링 — 서버 미해결 항목).
      properties:
        name: { type: string }
        breed: { type: string }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [male, female] }
        size: { type: string, enum: [small, medium, large] }
        weightKg: { type: number }
        energyLevel: { type: string, enum: [low, medium, high] }
        personalityTraits:
          $ref: "#/components/schemas/PersonalityTraits"
        neutered: { type: boolean }
        animalRegistrationNumber: { type: string }

    DogUpdate:
      type: object
      description: >
        `PATCH /dogs/{dogId}` 요청 본문. DogCreate 와 필드는 같지만 **name 을 포함해
        전부 선택**이고, null/미포함 필드는 "변경하지 않음"으로 처리된다
        (`Dog.patch`). 그래서 DogCreate 를 재사용하지 않는다.
      properties:
        name: { type: string }
        breed: { type: string }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [male, female] }
        size: { type: string, enum: [small, medium, large] }
        weightKg: { type: number }
        energyLevel: { type: string, enum: [low, medium, high] }
        personalityTraits:
          $ref: "#/components/schemas/PersonalityTraits"
        neutered: { type: boolean }
        animalRegistrationNumber: { type: string }

    DogPublic:
      type: object
      description: 타인에게 노출되는 강아지 정보(추천 피드/친구 목록). 원본 좌표 없음.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        breed: { type: string, nullable: true }
        ageMonths: { type: integer, nullable: true, description: birth_date에서 서버가 계산 }
        gender: { type: string, enum: [male, female], nullable: true }
        size: { type: string, enum: [small, medium, large], nullable: true }
        energyLevel: { type: string, enum: [low, medium, high], nullable: true }
        personalityTraits:
          $ref: "#/components/schemas/PersonalityTraits"
        neutered: { type: boolean, nullable: true }
        profileImageUrl: { type: string, nullable: true }
        cutoutImageUrl: { type: string, nullable: true }

    # ---------------- 친구 (★ v3 핵심) ----------------
    FriendRecommendation:
      type: object
      properties:
        dog: { $ref: "#/components/schemas/DogPublic" }
        owner: { $ref: "#/components/schemas/UserSummary" }
        distanceKm:
          type: integer
          description: >
            정수 km로 반올림한 거리. 원본 좌표는 절대 내려주지 않는다 — 흐림 처리는
            저장이 아니라 직렬화 단계에서 한다.
          example: 2
        reason:
          type: string
          description: >
            매칭 이유 문장. **점수(score)를 숫자로 노출하지 않는다** — 근거 없는
            정밀도를 주장하게 되고 알고리즘 변경도 어려워진다.
          example: "우리 아이랑 나이도 비슷하고 둘 다 활발해요"
        requestStatus:
          type: string
          enum: [none, sent, received]
          description: 나와 이 강아지 사이의 pending 신청 상태

    FriendRecommendationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FriendRecommendation" }
        nextCursor: { type: string, nullable: true }
        appliedRadiusKm:
          type: integer
          description: >
            실제로 적용된 검색 반경. 후보가 limit 미만이면 서버가 단계적으로 확장한
            결과값이다(KKODONG_CONCEPT.md 2.2). 클라이언트가 "조금 멀리까지 찾아봤어요"
            같은 안내를 띄우는 데 쓴다.

    FriendRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        requesterDog: { $ref: "#/components/schemas/DogPublic" }
        receiverDog: { $ref: "#/components/schemas/DogPublic" }
        message: { type: string, nullable: true }
        status: { type: string, enum: [pending, accepted, rejected, cancelled] }
        createdAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }

    FriendRequestCreate:
      type: object
      required: [requesterDogId, receiverDogId]
      properties:
        requesterDogId:
          type: string
          format: uuid
          description: 내 강아지. 서버가 소유자 == 요청자인지 검증
        receiverDogId: { type: string, format: uuid }
        message: { type: string, maxLength: 200 }

    RespondRequest:
      type: object
      required: [accept]
      properties:
        accept: { type: boolean }

    Friendship:
      type: object
      properties:
        id: { type: string, format: uuid }
        friendDog: { $ref: "#/components/schemas/DogPublic" }
        friendOwner: { $ref: "#/components/schemas/UserSummary" }
        myDogId: { type: string, format: uuid }
        walkCount:
          type: integer
          description: 함께 완료한 산책 횟수
        lastMessagePreview: { type: string, nullable: true }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        upcomingAppointment:
          allOf: [{ $ref: "#/components/schemas/WalkAppointment" }]
          nullable: true
        createdAt: { type: string, format: date-time }

    # ---------------- 채팅 & 산책 약속 ----------------
    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        friendshipId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    ChatMessagePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        nextCursor: { type: string, nullable: true }

    WalkAppointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        friendshipId: { type: string, format: uuid }
        proposedByUserId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        placeName: { type: string, nullable: true }
        location:
          allOf: [{ $ref: "#/components/schemas/Coordinate" }]
          nullable: true
          description: 약속 장소는 의도적으로 정밀하다(추천 피드의 흐림 규칙과 다름)
        status:
          type: string
          enum: [proposed, accepted, declined, cancelled, completed]
        isFirstMeeting:
          type: boolean
          description: >
            이 friendship에 completed 약속이 아직 없으면 true. 클라이언트가 안전 넛지
            문구를 띄우는 조건(QUESTIONS.md Q3, TICKETS_MVP.md CHAT-2).
        createdAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }

    WalkAppointmentCreate:
      type: object
      required: [friendshipId, scheduledAt]
      properties:
        friendshipId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        placeName: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    # ---------------- 산책 ----------------
    RoutePoint:
      type: object
      required: [lat, lng, ts]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        ts: { type: string, format: date-time }

    WalkSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        dogId: { type: string, format: uuid }
        walkAppointmentId: { type: string, format: uuid, nullable: true }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        distanceMeters: { type: number, nullable: true }
        route:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/RoutePoint" }
        poopCount: { type: integer, default: 0 }
        peeCount: { type: integer, default: 0 }
        weatherCondition: { type: string, nullable: true }
        weatherTempCelsius: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }

    WalkSessionStart:
      type: object
      required: [dogId, startedAt]
      properties:
        dogId: { type: string, format: uuid }
        walkAppointmentId:
          type: string
          format: uuid
          description: 친구와의 약속에서 시작한 산책이면 연결. 혼자 산책이면 생략
        startedAt: { type: string, format: date-time }

    WalkSessionComplete:
      type: object
      required: [endedAt]
      properties:
        endedAt: { type: string, format: date-time }
        distanceMeters: { type: number }
        route:
          type: array
          items: { $ref: "#/components/schemas/RoutePoint" }
        weatherCondition:
          type: string
          description: 날씨는 클라이언트가 조회해 전달(날씨 API 미선정 — API_SPEC.md 미확정 항목 1번)
        weatherTempCelsius: { type: number }

    BathroomLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        walkSessionId: { type: string, format: uuid }
        clientLogId: { type: string, nullable: true }
        type: { type: string, enum: [poop, pee] }
        location:
          allOf: [{ $ref: "#/components/schemas/Coordinate" }]
          nullable: true
        loggedAt: { type: string, format: date-time }

    BathroomLogCreate:
      type: object
      required: [type, loggedAt]
      properties:
        clientLogId:
          type: string
          description: >
            클라이언트가 생성하는 멱등키. 산책 중 네트워크가 끊겨 재전송될 때 카운트가
            중복 증가하는 것을 막는다 — 같은 clientLogId는 한 번만 INSERT.
        type: { type: string, enum: [poop, pee] }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        loggedAt: { type: string, format: date-time }

    BathroomLogBatch:
      type: object
      description: >
        오프라인 큐 일괄 전송용. 단건 객체와 배열 body를 둘 다 받는다
        (API_SPEC.md 5.2 배치 전송 규약).
      properties:
        logs:
          type: array
          items: { $ref: "#/components/schemas/BathroomLogCreate" }

    SavedRoute:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        dogId: { type: string, format: uuid, nullable: true }
        sourceSessionId: { type: string, format: uuid, nullable: true }
        name: { type: string, example: "한강 코스" }
        path:
          type: array
          items: { $ref: "#/components/schemas/RoutePoint" }
        distanceMeters: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }

    SavedRouteCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sourceSessionId:
          type: string
          format: uuid
          description: 지정하면 해당 세션의 route를 서버가 복사한다(path 생략 가능)
        dogId: { type: string, format: uuid }
        path:
          type: array
          items: { $ref: "#/components/schemas/RoutePoint" }
        distanceMeters: { type: number }

    # ---------------- 완료 카드 ----------------
    WalkCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        walkSessionId: { type: string, format: uuid }
        imageUrl: { type: string }
        templateStyle:
          type: string
          description: >
            Free는 'default'만 허용 — 서버가 users.subscription_tier로 검증한다(403).
            클라이언트 검증만 두지 않는다. 카드 커스터마이징이 패스권의 핵심 전환 포인트다.
          example: default
        sharedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # ---------------- 커뮤니티 ----------------
    CommunityPost:
      type: object
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/UserSummary" }
        serviceAreaId: { type: string, format: uuid, nullable: true }
        serviceAreaName: { type: string, nullable: true }
        title: { type: string, nullable: true }
        content: { type: string }
        imageUrls: { type: array, items: { type: string } }
        likeCount: { type: integer }
        commentCount: { type: integer }
        likedByMe: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CommunityPostCreate:
      type: object
      required: [content]
      properties:
        title: { type: string, maxLength: 100 }
        content: { type: string }
        imageUrls: { type: array, items: { type: string } }

    CommunityPostPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CommunityPost" }
        nextCursor: { type: string, nullable: true }

    CommunityComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/UserSummary" }
        parentCommentId: { type: string, format: uuid, nullable: true }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    CommunityCommentCreate:
      type: object
      required: [content]
      properties:
        content: { type: string }
        parentCommentId: { type: string, format: uuid }

    # ---------------- 케어 ----------------
    CareRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        dogId: { type: string, format: uuid }
        careType:
          type: string
          enum: [vaccination, heartworm, deworming, checkup, other]
        careName: { type: string, example: "종합백신" }
        doseSequence:
          type: integer
          nullable: true
          description: 접종 차수(1차, 2차...). 반복형(심장사상충 등)이면 null
        administeredDate: { type: string, format: date }
        nextDueDate: { type: string, format: date, nullable: true }
        repeatIntervalDays:
          type: integer
          nullable: true
          description: 반복 주기(일). 예 심장사상충 30. 1회성이면 null
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CareRecordCreate:
      type: object
      required: [careType, careName, administeredDate]
      properties:
        careType:
          type: string
          enum: [vaccination, heartworm, deworming, checkup, other]
        careName: { type: string }
        doseSequence: { type: integer }
        administeredDate: { type: string, format: date }
        nextDueDate: { type: string, format: date }
        repeatIntervalDays: { type: integer }
        memo: { type: string }

    CareTemplateItem:
      type: object
      description: 견종·나이 기반 권장 스케줄 제안(앱 내장 + 서버 오버라이드 하이브리드)
      properties:
        careType: { type: string, enum: [vaccination, heartworm, deworming, checkup, other] }
        careName: { type: string }
        doseSequence: { type: integer, nullable: true }
        recommendedAgeWeeks: { type: integer, nullable: true }
        repeatIntervalDays: { type: integer, nullable: true }
        description: { type: string, nullable: true }

    # ---------------- 서비스 지역 ----------------
    ServiceArea:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "이촌동" }
        center: { $ref: "#/components/schemas/Coordinate" }
        radiusMeters: { type: integer }
        status: { type: string, enum: [active, planned] }

    ServiceAreaCheckRequest:
      allOf: [{ $ref: "#/components/schemas/Coordinate" }]

    ServiceAreaCheckResult:
      type: object
      properties:
        inService: { type: boolean }
        serviceAreaId: { type: string, format: uuid, nullable: true }
        serviceAreaName: { type: string, nullable: true }

    WaitlistSignupCreate:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        nearestServiceAreaId: { type: string, format: uuid }

    # ---------------- 패스권 ----------------
    SubscriptionVerifyRequest:
      type: object
      required: [signedTransaction]
      properties:
        signedTransaction:
          type: string
          description: StoreKit 2 JWS. 서버가 Apple App Store Server API로 재검증한다(클라이언트 신고값 불신)

    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        tier: { type: string, enum: [plus, pro] }
        productId: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [active, expired, cancelled] }
        entitlements:
          type: object
          description: 해제된 권한. 클라이언트가 UI 잠금 해제에 사용(최종 검증은 서버)
          properties:
            maxDogs: { type: integer, example: 3 }
            availableCardTemplates:
              type: array
              items: { type: string }

    # ---------------- 안전 ----------------
    BlockResult:
      type: object
      description: >
        `POST /blocks` 응답(`BlockResponse.detailInfo`). **차단 시각을 일부러 넣지
        않는다** — created_at 은 DB DEFAULT 가 채우므로 INSERT 직후 엔티티에는 null
        이고, 기존 차단을 재요청한 경우에만 값이 있어 같은 API 가 상황에 따라
        null/값을 오간다. 차단 시각이 필요한 화면은 목록(GET /blocks)뿐이다.
      properties:
        blockedId: { type: string, format: uuid }

    Block:
      type: object
      description: >
        `GET /blocks` 목록 항목(`BlockResponse.listItem`). UUID 만 내려주면
        "차단 해제" 리스트를 그릴 수 없어 상대 유저 표시 정보를 함께 담는다.
      properties:
        blockedId: { type: string, format: uuid }
        displayName: { type: string, nullable: true }
        profileImageUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    BlockCreate:
      type: object
      required: [blockedId]
      properties:
        blockedId: { type: string, format: uuid }

    ReportCreate:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType:
          type: string
          enum: [user, community_post, community_comment]
        targetId: { type: string, format: uuid }
        reason:
          type: string
          enum: [inappropriate_behavior, safety_concern, harassment, fake_profile, spam, other]
        details: { type: string, maxLength: 1000 }

    ReportResult:
      type: object
      description: >
        `POST /reports` 응답(`ReportResponse.detailInfo`). 접수 시각은 넣지 않는다 —
        DB DEFAULT 가 채우므로 INSERT 직후 엔티티에는 null 이고, Phase 1 은 신고 목록
        조회 API 자체가 없어 클라이언트가 쓸 화면이 없다(BlockResult 와 같은 판단).
      properties:
        reportId: { type: string, format: uuid }
        status: { type: string, enum: [pending, reviewed, action_taken, dismissed] }

    # ---------------- 만남 진입로 (MEET-2) ----------------
    EncounterCandidates:
      type: object
      description: >
        ⚠️ **스친 시각·좌표를 절대 포함하지 않는다.** 강아지 식별 정보만 내려간다 —
        "몇 시에 어디서 스쳤다"는 이동 이력이고, 노출되는 순간 home_location 흐림이
        무의미해진다(추천 피드의 위치 처리 원칙과 동일).
      properties:
        candidates:
          type: array
          items:
            type: object
            properties:
              dogId: { type: string, format: uuid }
              name: { type: string }
              breed: { type: string, nullable: true }
              profileImageUrl: { type: string, nullable: true }
              cutoutImageUrl: { type: string, nullable: true }

    EncounterConfirmRequest:
      type: object
      required: [dogIds]
      properties:
        dogIds:
          type: array
          items: { type: string, format: uuid }
          description: 빈 배열은 "없었어요". 이미 친구인 상대가 섞여 있으면 무시된다(에러 아님).

    EncounterConfirmResult:
      type: object
      description: >
        ⚠️ **한쪽만 선택한 사실은 어떤 경로로도 노출되지 않는다** — 푸시·뱃지·목록
        어디에도 남기지 않는다. "누군가 나를 골랐다"가 새어나가는 순간 거절이라는
        개념이 생기고, 이 설계의 유일한 존재 이유(거절 없는 진입로)가 사라진다.
        따라서 이 응답의 matched 에는 **상호 확인이 성립한 쌍만** 실린다.
      properties:
        confirmed: { type: integer, description: 이번 요청에서 확인한 강아지 수 }
        matched:
          type: array
          items:
            type: object
            properties:
              dogId: { type: string, format: uuid }
              friendshipId: { type: string, format: uuid }

    # ---------------- 푸시 ----------------
    DeviceTokenCreate:
      type: object
      required: [apnsToken]
      properties:
        apnsToken: { type: string }
        platform: { type: string, enum: [ios], default: ios }

paths:
  # ============================================================
  # Auth (FOUNDATION-1)
  # ============================================================
  /auth/signup:
    post:
      tags: [Auth]
      summary: 이메일 회원가입
      description: >
        가입만 처리하고 토큰은 발급하지 않는다 — 가입 직후 클라이언트가 /auth/login을
        별도 호출해야 한다. displayName은 비워둔 채 생성되고 온보딩에서 채워진다.
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Created — 가입 완료(토큰 없음, 로그인 필요)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { type: object, nullable: true, example: null }
        "400":
          description: 이미 가입된 이메일(M001) 또는 입력값 검증 실패(CM001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /auth/login:
    post:
      tags: [Auth]
      summary: 이메일 로그인
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthTokens" }
        "400":
          description: 이메일 또는 비밀번호 불일치(M003 — 401이 아님)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /auth/apple:
    post:
      tags: [Auth]
      summary: Sign in with Apple
      description: identityToken의 sub claim을 users.apple_user_id와 매칭, 없으면 신규 유저 생성
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppleSignInRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 토큰 갱신 (RT 회전)
      description: Redis에서 RT 유효성 확인 후 새 AT/RT 쌍 발급. 기존 RT는 즉시 폐기된다.
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthTokens" }
        "401":
          description: 만료/무효 RT(A002/A003) 또는 존재하지 않는 RT(A004)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: >
        Redis에서 RT 삭제 + 현재 AT를 블랙리스트 등록. AT는 Authorization 헤더로,
        RT는 body로 전달한다 — **둘 다 필수**다.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutRequest" }
      responses:
        "200": { $ref: "#/components/responses/OkNoData" }
        "401": { $ref: "#/components/responses/Unauthorized" }

