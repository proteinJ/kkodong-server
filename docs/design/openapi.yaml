  # ============================================================
  # Subscription / 패스권 (PASS-1)
  # ============================================================
  /subscriptions/verify:
    post:
      tags: [Subscription]
      summary: 패스권 구매 검증 (StoreKit 2)
      description: >
        서버가 Apple App Store Server API로 재검증한 뒤 subscriptions upsert +
        users.subscription_tier 갱신. **클라이언트 신고값은 신뢰하지 않는다.**
        Phase 1은 웹훅(App Store Server Notifications) 대신 앱 실행 시
        Transaction.currentEntitlements 확인 후 이 API 재호출로 간소화한다.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionVerifyRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /subscriptions/me:
