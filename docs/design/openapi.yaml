  # ============================================================
  # Dogs (PET-1)
  # ============================================================
  /dogs:
    get:
      tags: [Dogs]
      summary: 내 반려견 목록
      description: >
        ⚠️ **owner 파라미터는 서버가 읽지 않는다.** 이 엔드포인트는 항상 JWT 주체의
        반려견만 돌려준다(`DogService.animalListGet`). 타인의 반려견 목록을 조회하는
        경로는 없다 — 호환을 위해 파라미터 정의만 남겨둔다.
      parameters:
        - name: owner
          in: query
          schema: { type: string, enum: [me] }
          description: 무시된다(위 설명 참조)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Dog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Dogs]
      summary: 반려견 등록
      description: >
        owner_id는 서버가 JWT에서 추출한다(클라이언트가 보내지 않음 — 위변조 방지).
        패스권 마릿수 한도 초과 시 403 — 이 검증은 반드시 서버 Service 계층에서 한다.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DogCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Dog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            패스권 마릿수 한도 초과 — 업그레이드 유도 지점(PASS-1).
            ⚠️ **미구현**: `users.subscription_tier`가 아직 엔티티에 매핑돼 있지 않아
            현재 서버는 마릿수를 제한하지 않는다. PASS-1 착수 시 구현한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /dogs/{dogId}:
    parameters:
      - name: dogId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Dogs]
      summary: 반려견 상세 (본인 소유만)
      description: >
        ⚠️ **본인이 소유한 반려견만 조회할 수 있다** — 요청자 != owner_id 면 403(A005).


        FRIEND-1(추천 피드)·FRIEND-3(친구 강아지 프로필 상세)은 타인의 강아지를
        보여줘야 하지만, 그 화면들은 이 경로를 쓰지 않는다. 타인에게 노출되는 정보는
        `DogPublic`(원본 좌표·동물등록번호 제외)이고, FRIEND-3 착수 시
        **`GET /dogs/{dogId}/public` 을 별도로 신설**한다. 이 경로의 403은 완화하지
        않는다 — 소유자 전용 필드(animalRegistrationNumber 등)가 섞여 있기 때문이다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Dog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Dogs]
      summary: 반려견 정보 수정
      description: >
        서버가 요청자 == owner_id를 검증한다(RLS 대신 Service 계층 —
        DEV_STACK_PIPELINE.md 2절). 부분 수정이며 응답은 **id/ownerId가 빠진
        축약형**(DogPatchResult)이다.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DogUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DogPatchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Dogs]
      summary: 반려견 삭제
      responses:
        "200": { $ref: "#/components/responses/OkNoData" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /dogs/{dogId}/photo:
    parameters:
      - name: dogId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Dogs]
      summary: 프로필 사진 업로드
      description: Cloudflare R2 저장. 반환 URL이 dogs.profile_image_url에 저장된다.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Dog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /dogs/{dogId}/cutout:
    parameters:
      - name: dogId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Dogs]
      summary: 누끼(배경 제거) 이미지 업로드 — ONBOARD-3
      description: >
        배경 제거는 **클라이언트 온디바이스(Vision VNGenerateForegroundInstanceMaskRequest)**
        에서 수행하고 서버는 결과 PNG(투명 배경)를 저장만 한다 — 서버 이미지 처리 비용 0.
        반환 URL이 dogs.cutout_image_url에 저장된다.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 투명 배경 PNG
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Dog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ============================================================
  # ★ Friends (FRIEND-1/2/3) — v3 핵심
  # ============================================================
  /friends/recommendations:
    get:
      tags: [Friends]
      summary: ★ 주변 강아지 친구 추천 (FRIEND-1)
      description: >
        **전체 명세는 docs/FRIEND_RECOMMENDATION_SPEC.md** (점수 공식, 신호별 계산식,
        견종 그룹 테이블, 문장 템플릿). 아래는 API 계약에 직접 걸리는 규약만 요약한다.


        **점수 공식 (2026-08-15 확정 / 2026-08-27 개정 — 산책 시간대 신설)**:
        `score = 30×거리 + 15×산책시간대 + 20×성격 + 15×나이 + 12×체급 + 8×견종`
        (성별·중성화는 초기 가중치 0). 각 항은 0.0~1.0으로 정규화, 가중치 합은 100.


        거리 논리("만나러 갈 수 없으면 친구가 안 된다")를 시간축에 그대로 적용한 것이
        시간대 신호다 — 같은 동네여도 나는 새벽 6시, 상대는 밤 11시면 평생 안 마주친다.
        합계 100을 유지하려고 거리 35→30, 성격 25→20, 체급 15→12, 견종 10→8로
        재배분했다. 실제 값은 코드가 아니라
        `application.yml`의 `kkodong.recommendation.weights.*` 에 있다.


        **서버 구현 규약 — 어기면 v2에서 HOLD됐던 콜드스타트 문제가 재발한다:**


        1. 성격·견종·나이를 WHERE 조건(하드 필터)으로 쓰지 않는다. 반경만 조건이고
        나머지는 전부 ORDER BY 가중치 점수 — 조건이 안 맞아도 후보에서 사라지지 않고
        순위만 내려간다.


        2. 결과가 limit 미만이면 반경을 1→2→3→5km로 자동 확장해 재조회하고, 실제
        적용된 반경을 appliedRadiusKm로 내려준다. **반경은 첫 페이지에서 확정해
        cursor에 인코딩한다** — 페이지마다 다시 계산하면 후보 집합이 바뀌어 중복·누락이
        생긴다. 상한 5km는 QUESTIONS.md Q8의 잠정값.


        3. 가중치·반경·태그 세트는 전부 application.yml 설정값으로 분리 — 코드 수정·
        재배포 없이 조정 가능해야 한다. 검증 수단이 실사용 데이터뿐이라, 바꾸기 어려우면
        사실상 튜닝을 안 하게 된다.


        4. 점수를 응답에 넣지 않는다. 대신 reason 문장을 서버가 생성한다
        ("궁합 87%" 같은 수치 표기 금지).


        5. distanceKm는 정수 반올림. 상대방 home_location 좌표는 절대 응답에 넣지 않는다.


        6. **데이터 미입력은 0점이 아니라 중립(0.5)으로 처리한다** — 성향 태그·생년월일·
        체급을 건너뛴 신규 유저가 추천 하위에 영구히 깔리면 스스로 콜드스타트를 만드는 셈이다.


        7. 점수를 소수점 첫째 자리에서 반올림한 뒤 **동점 그룹 내에서 무작위 셔플**한다
        (시드 = 내 user_id + 오늘 날짜). 완전 결정적이면 상위 강아지가 응답하지 않아도
        계속 상위에 남아 추천 화면이 정체된다.


        8. 제외 대상: 본인 소유 강아지, 차단 관계(양방향), **이미 친구인 견주의
        강아지 전부**(friendship 이 견주 단위이므로 — 이미 채팅방이 있는 상대를 다시
        추천하는 것은 소음이다), pending 신청이 있는 상대.
      parameters:
        - name: dogId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: 기준이 되는 내 강아지
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FriendRecommendationPage" }
        "400":
          description: home_location 미설정 등 추천 불가 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /friend-requests:
    get:
      tags: [Friends]
      summary: 친구 신청 목록 (보낸/받은)
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [sent, received] }
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, rejected, cancelled] }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/FriendRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Friends]
      summary: 친구 신청 (FRIEND-2)
      description: >
        서버가 requesterDogId의 소유자 == 요청자인지 검증한다. 차단 관계면 403,
        같은 쌍에 pending 신청이 이미 있으면 409. 상대에게 APNs 푸시 발송.


        **지표**: 신청 수/수락 수/수락까지 걸린 시간을 Phase 1부터 로깅한다 —
        친구 신청 수락률이 이 제품의 1순위 지표이자 추천 가중치 조정의 유일한 근거다.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FriendRequestCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FriendRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: 차단 관계 — 신청 불가(SAFETY-1)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /friend-requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Friends]
      summary: 친구 신청 취소
      description: 신청자 본인만, pending 상태일 때만. status='cancelled'로 변경.
      responses:
        "200": { $ref: "#/components/responses/OkNoData" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /friend-requests/{requestId}/respond:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Friends]
      summary: 친구 신청 수락/거절 (FRIEND-2)
      description: >
        수락 시 @Transactional로 friend_requests.status='accepted' + friendships upsert
        + 채팅 개설. **friendship은 견주 쌍에 유일하다(2026-08-27 결정)** — 이미 그
        견주와 친구면 새로 만들지 않고 기존 것을 재사용한다(채팅방도 그대로).
        저장 시 user_a_id < user_b_id로 정렬할 것 — 안 그러면 (A,B)와 (B,A)가
        둘 다 들어간다. 거절 시 상태만 변경.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RespondRequest" }
      responses:
        "200":
          description: OK — 수락 시 생성된 friendship, 거절 시 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf: [{ $ref: "#/components/schemas/Friendship" }]
                        nullable: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /friendships:
    get:
      tags: [Friends]
      summary: 내 친구 목록 (FRIEND-3)
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Friendship" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /friendships/{friendshipId}:
    parameters:
      - name: friendshipId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Friends]
      summary: 친구 상세
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Friendship" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Friends]
      summary: 친구 끊기
      description: 양쪽 모두 가능. 채팅·산책 약속이 비활성화된다.
      responses:
        "200": { $ref: "#/components/responses/OkNoData" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ============================================================
  # Chat & Appointments (CHAT-1/2)
  # ============================================================
  /friendships/{friendshipId}/messages:
    parameters:
      - name: friendshipId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Chat & Appointments]
      summary: 채팅 메시지 목록 (초기 로드, 최신순)
      description: >
        실시간 송수신은 STOMP(`/topic/chat.{friendshipId}` SUBSCRIBE,
        `/app/chat.{friendshipId}` SEND). 서버는 SUBSCRIBE/SEND 시 요청자가 해당
        friendship의 당사자인지, 차단 관계가 아닌지 검증한다 — RLS가 없으므로 직접 구현.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChatMessagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /walk-appointments:
    get:
      tags: [Chat & Appointments]
      summary: 산책 약속 목록
      parameters:
        - name: friendshipId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [proposed, accepted, declined, cancelled, completed] }
        - name: upcoming
          in: query
          schema: { type: boolean }
          description: true면 전체 친구 대상 다가오는 약속만
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WalkAppointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Chat & Appointments]
      summary: 산책 약속 제안 (CHAT-2)
      description: >
        친구 루프의 목적지다 — 채팅에만 맡기면 실제 만남으로 이어지지 않으므로 1급
        기능으로 분리했다(KKODONG_CONCEPT.md 2.3 ⑤). proposedByUserId는 JWT에서 추출.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalkAppointmentCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WalkAppointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /walk-appointments/{appointmentId}/respond:
    parameters:
      - name: appointmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Chat & Appointments]
      summary: 산책 약속 수락/거절
      description: >
        제안자 본인은 응답할 수 없다(400). 수락된 약속이 isFirstMeeting=true이면
        클라이언트가 안전 넛지 문구를 노출한다(QUESTIONS.md Q3).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RespondRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WalkAppointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /walk-appointments/{appointmentId}/cancel:
    parameters:
      - name: appointmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Chat & Appointments]
      summary: 산책 약속 취소 (양쪽 모두 가능)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WalkAppointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ============================================================
  # Push Tokens
  # ============================================================
  /device-tokens:
    post:
      tags: [Push Tokens]
      summary: 디바이스 토큰 등록/갱신 (upsert)
      description: 앱 실행 시마다 호출. 친구 신청/수락, 채팅, 약속, 커뮤니티 댓글 푸시의 전제 조건.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceTokenCreate" }
      responses:
        "200": { $ref: "#/components/responses/OkNoData" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /device-tokens/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Push Tokens]
      summary: 디바이스 토큰 삭제 (로그아웃 시)
      responses:
        "200": { $ref: "#/components/responses/OkNoData" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ============================================================
  # Walk (WALK-1/2/3)
  # ============================================================
  /walk-sessions:
    get:
      tags: [Walk]
      summary: 산책 기록 목록 (지난 경로 다시보기 — WALK-3)
      parameters:
        - name: dogId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/WalkSession" }
                          nextCursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Walk]
      summary: 산책 시작 (WALK-1)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalkSessionStart" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WalkSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /walk-sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Walk]
      summary: 산책 기록 상세 (경로 포함)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WalkSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /walk-sessions/{sessionId}/complete:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Walk]
      summary: 산책 종료 (WALK-1)
      description: 종료 직후 클라이언트가 완료 카드(CARD-1)를 렌더링해 /walk-cards로 업로드한다.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalkSessionComplete" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WalkSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /walk-sessions/{sessionId}/bathroom-logs:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Walk]
      summary: 배변 기록 목록 (WALK-2)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/BathroomLog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Walk]
      summary: 배변 기록 추가 (똥/오줌 버튼 — WALK-2)
      description: >
        @Transactional로 walk_sessions.poop_count/pee_count를 함께 증가시킨다.


        **오프라인 대비**: 산책 중 네트워크는 불안정한 게 정상이라 클라이언트가 로컬
        큐에 쌓아 일괄 전송할 수 있어야 한다. 단건 객체와 `{logs: [...]}` 배치 body를
        둘 다 받고, clientLogId로 멱등성을 보장한다 — 재전송 시 카운트가 중복
        증가하면 안 된다.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BathroomLogCreate"
                - $ref: "#/components/schemas/BathroomLogBatch"
      responses:
        "201":
          description: Created — 갱신된 세션 집계 포함
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WalkSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /walk-bathroom-logs/{logId}:
    parameters:
      - name: logId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Walk]
      summary: 배변 기록 삭제 (오탭 취소)
      description: 집계 컬럼(poop_count/pee_count)도 같은 트랜잭션에서 감소시킨다.
      responses:
        "200": { $ref: "#/components/responses/OkNoData" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /saved-routes:
    get:
      tags: [Walk]
      summary: 저장한 산책 경로 목록 (WALK-3)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SavedRoute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Walk]
      summary: 산책 경로 저장 (WALK-3)
      description: >
        sourceSessionId만 주면 해당 세션의 route를 서버가 복사한다.
        **동네 인기 산책로 추천은 Phase 2** — 이 API에 포함되지 않는다(QUESTIONS.md Q9).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedRouteCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SavedRoute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /saved-routes/{routeId}:
    parameters:
      - name: routeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Walk]
      summary: 저장 경로 상세
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SavedRoute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Walk]
      summary: 저장 경로 이름 변경
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SavedRoute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Walk]
      summary: 저장 경로 삭제
      responses:
        "200": { $ref: "#/components/responses/OkNoData" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ============================================================
  # Walk Cards (CARD-1/2)
  # ============================================================
  /walk-cards:
    get:
      tags: [Walk Cards]
      summary: 내 완료 카드 목록
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WalkCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Walk Cards]
      summary: 완료 카드 업로드 + 메타 저장 (CARD-1)
      description: >
        카드 이미지는 클라이언트가 SwiftUI 뷰로 렌더링한다(서버 렌더링 아님).
        내용물: 거리·시간·날씨·배변 횟수·강아지 누끼 이미지 + 서비스 아이덴티티("꼬동"), 9:16.


        **templateStyle은 서버가 users.subscription_tier로 검증한다** — Free는
        'default'만 허용하고 그 외는 403. 카드 커스터마이징이 패스권의 핵심 전환
        포인트라 클라이언트 검증만 두면 수익 축이 우회된다.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [walkSessionId, file]
              properties:
                walkSessionId: { type: string, format: uuid }
                templateStyle: { type: string, default: default }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WalkCard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: 패스권 없이 유료 템플릿 요청 — 업그레이드 유도 지점(PASS-1)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /walk-cards/{cardId}:
    parameters:
      - name: cardId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Walk Cards]
      summary: 카드 공유 시각 기록 (CARD-2, 바이럴 측정)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sharedAt: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WalkCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ============================================================
  # Community (COMMUNITY-1/2)
  # ============================================================
  /community/posts:
    get:
      tags: [Community]
      summary: 커뮤니티 글 목록
      description: >
        **정렬은 단순 최신순이 아니다** — 동네(service_area_id) 일치와 친구 관계를
        노출 우선순위에 반영한다. 이게 없으면 기존 대형 반려동물 커뮤니티와 구분되지
        않는다(KKODONG_CONCEPT.md 3.4). 차단 유저의 글은 제외.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [nearby, all], default: nearby }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CommunityPostPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Community]
      summary: 글 작성
      description: service_area_id는 클라이언트가 보내지 않는다 — 서버가 작성자 home_location으로 판정해 채운다.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityPostCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
